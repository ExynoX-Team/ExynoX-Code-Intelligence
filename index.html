      (function() {
        try {
          if (typeof window !== 'undefined') {
            // Intercept window.onerror and unhandledrejection immediately
            var origOnError = window.onerror;
            window.onerror = function(message, source, lineno, colno, error) {
              var msg = String(message || (error && error.message) || '');
              if (msg.indexOf('fetch') !== -1 && msg.indexOf('getter') !== -1) {
                return true; // suppresses error
              }
              if (typeof origOnError === 'function') {
                return origOnError.apply(this, arguments);
              }
              return false;
            };

            window.addEventListener('error', function(event) {
              var msg = String((event && event.message) || (event && event.error && event.error.message) || '');
              if (msg.indexOf('fetch') !== -1 && msg.indexOf('getter') !== -1) {
                if (event.preventDefault) event.preventDefault();
                if (event.stopImmediatePropagation) event.stopImmediatePropagation();
                return true;
              }
            }, true);

            var originalFetch = window.fetch;
            var currentFetch = originalFetch;

            // 1. Patch entire prototype chain (Window, WindowProperties, EventTarget, etc.)
            var curr = window;
            while (curr) {
              try {
                var desc = Object.getOwnPropertyDescriptor(curr, 'fetch');
                if (desc) {
                  if (desc.configurable) {
                    Object.defineProperty(curr, 'fetch', {
                      get: function() { return currentFetch; },
                      set: function(fn) { currentFetch = fn; },
                      configurable: true,
                      enumerable: true
                    });
                  }
                }
              } catch (_e) {}
              try {
                curr = Object.getPrototypeOf(curr);
              } catch (_e2) {
                break;
              }
            }

            // 2. Also ensure window itself has an explicit setter
            try {
              Object.defineProperty(window, 'fetch', {
                get: function() { return currentFetch; },
                set: function(fn) { currentFetch = fn; },
                configurable: true,
                enumerable: true
              });
            } catch (_e3) {
              try {
                window.fetch = originalFetch;
              } catch (_e4) {}
            }
          }
        } catch (_outerErr) {}
      })();
    </script>
